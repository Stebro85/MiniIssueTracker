<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <Title>Mini Issue Tracker</Title>
        <link rel="stylesheet" href="CSS/styles.css">
    </head>
    <body>
        <div class="container">
            <header class="app-header">
                <h1>Mini Issue Tracker</h1>

                <div class="role-selector">
                    <label for="role">Rol</label>
                    <select id="role">
                        <option value="Reporter">Melder</option>
                        <option value="Handler">Behandelaar</option>
                    </select>
                </div>
            </header>

            <div class="app-layout">

                <aside class="sidebar">
                    <h2 class="sidebar-title">Issues</h2>
                    
                    <div id="issue-error" hidden></div>
                    <div id="issue-list"></div>
                </aside>

                <main class="main-content">
                    <section id="create-section">
                        <h2>Nieuwe issue</h2>

                        <form id="create-issue-form">
                            <label for="title">Titel</label>
                            <input type="text" id="title">

                            <label for="description">Beschrijving</label>
                            <textarea id="description"></textarea>

                            <label for="type">Type</label>
                            <select id="type">
                                <option value="Bug">Bug</option>
                                <option value="Feature">Feature</option>
                                <option value="Task">Task</option> 
                            </select>

                            <button type="submit">Issue aanmaken</button>
                        </form>

                        <p id="create-error" hidden></p>
                    </section>

                    <section id="edit-section" hidden>
                        <h2>Issue bewerken</h2>

                        <form id="edit-issue-form">
                            <label for="edit-title">Titel</label>
                            <input type="text" id="edit-title">

                            <label for="edit-description">Beschrijving</label>
                            <Textarea id="edit-description"></Textarea>

                            <label for="edit-type">Type</label>
                            <select id="edit-type">
                                <option value="Bug">Bug</option>
                                <option value="Feature">Feature</option>
                                <option value="Task">Task</option>
                            </select>

                            <button type="submit">Wijzigingen opslaan</button>
                        </form>

                        <p id="edit-error" hidden></p>
                    </section>

                    <section id="handle-section" hidden>
                        <h2> Issue behandelen</h2>

                        <form id="handle-issue-form">
                            <label for="handle-description">Beschrijving</label>
                            <textarea id="handle-description"></textarea>

                            <label for="handle-type">Type</label>
                            <select id="handle-type">
                                <option value="Bug">Bug</option>
                                <option value="Feature">Feature</option>
                                <option value="Task">Task</option>
                            </select>

                            <label for="handle-priority">Prioriteit</label>
                            <select id="handle-priority">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>

                            <Label for="handle-status">Status</Label>
                            <select id="handle-status">
                                <option value="Open">Open</option>
                                <option value="InProgress">InProgress</option>
                                <option value="Done">Done</option>
                            </select>

                            <button type="submit">Behandeling opslaan</button>
                        </form>

                        <p id="handle-error" hidden></p>
                    </section>

                </main>

            </div>
            
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
